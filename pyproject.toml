[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-discord-logger"
version = "1.0.0"
description = "An Endstone plugin for logging server events to Discord webhooks"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "aiohttp>=3.8.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "typing_extensions>=4.0"
]

[project.optional-dependencies]
dev = ["endstone", "ruff", "pytest", "pytest-asyncio"]

[project.entry-points."endstone"]
discord_logger = "endstone_discord_logger:DiscordLoggerPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_discord_logger"]
include = [
    "src/endstone_discord_logger/config.toml",
    "src/endstone_discord_logger/translations/*.toml"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "E", "F", "W", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
